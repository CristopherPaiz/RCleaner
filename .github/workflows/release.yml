name: Release

# Pushing a tag like v0.2.0 builds the installer and the portable exe and
# publishes a GitHub release whose notes are the "## [0.2.0]" section of CHANGELOG.md.
# Create the tag with scripts/release.ps1 (see docs/BUILD.md#releases).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build installers and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version and read release notes
        id: notes
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version = "([^"]+)"') { throw 'No version in Cargo.toml' }
          if ($Matches[1] -ne $version) {
            throw "Tag $tag does not match Cargo.toml version $($Matches[1])"
          }
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## \[$([regex]::Escape($version))\]") { $start = $i + 1; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[' -or $lines[$i] -match '^\[[^\]]+\]: ') { $end = $i; break }
          }
          $notes = ($lines[$start..($end - 1)] -join "`n").Trim()
          if (-not $notes) { throw "CHANGELOG.md section for $version is empty" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install UI dependencies
        working-directory: app
        run: npm ci --no-fund --no-audit

      # With the signing key (repo secrets) the build also signs the installers
      # for the in-app updater; without it the release still works, minus updates.
      - name: Build installers
        working-directory: app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Set-Content updater.json '{"bundle":{"createUpdaterArtifacts":true}}'
            npx --yes @tauri-apps/cli@^2 build --config updater.json
          } else {
            Write-Warning 'TAURI_SIGNING_PRIVATE_KEY is not set: no auto-update files for this release'
            npx --yes @tauri-apps/cli@^2 build
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.notes.outputs.version }}'
          # One setup that asks for the language (English / Spanish).
          $files = @(Get-ChildItem target/release/bundle -Recurse -Include "RCleaner_${v}_*-setup.exe")
          if ($files.Count -lt 1) { throw 'Installer not found' }
          # Portable build: the same exe the installers ship, runs without installing.
          $portable = "RCleaner_${v}_x64-portable.exe"
          Copy-Item target/release/rcleaner.exe $portable
          $assets = @($files.FullName) + $portable

          # latest.json for the in-app updater (only when the build was signed).
          $nsis = $files | Where-Object Name -like '*-setup.exe' | Select-Object -First 1
          if (Test-Path "$($nsis.FullName).sig") {
            $base = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}'
            $entry = { param($f) [ordered]@{ signature = (Get-Content "$($f.FullName).sig" -Raw).Trim(); url = "$base/$($f.Name)" } }
            $platforms = [ordered]@{ 'windows-x86_64' = & $entry $nsis; 'windows-x86_64-nsis' = & $entry $nsis }
            [ordered]@{
              version   = $v
              notes     = (Get-Content release-notes.md -Raw).Trim()
              pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
              platforms = $platforms
            } | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
            $assets += 'latest.json'
          }

          gh release create '${{ github.ref_name }}' $assets `
            --title "RCleaner $v" --notes-file release-notes.md
