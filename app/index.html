<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RCleaner</title>
  </head>
  <body>
    <!-- Pantalla de carga: visible hasta que la app tiene sus datos (App.svelte la quita). -->
    <div id="splash">
      <img src="/src/assets/logo.png" width="84" height="84" alt="" />
      <div class="bar"><span></span></div>
    </div>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 26px; background: #0b0c10; transition: opacity 0.25s ease;
      }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash img { filter: drop-shadow(0 14px 32px rgb(37 99 235 / 0.45)); animation: breathe 1.6s ease-in-out infinite; }
      #splash .bar { width: 120px; height: 3px; border-radius: 99px; background: rgb(255 255 255 / 0.1); overflow: hidden; }
      #splash .bar span { display: block; width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #3d8bff, #62d3ff); animation: slide 1.1s ease-in-out infinite; }
      @keyframes breathe { 50% { transform: scale(1.05); } }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-color-scheme: light) {
        #splash { background: #f5f6f8; }
        #splash .bar { background: rgb(0 0 0 / 0.08); }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
